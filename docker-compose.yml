
services:

  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    networks:
        - my_network


  neo4j:
    image: neo4j:5
    container_name: neo4j-db
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/LinkedIn

    volumes:
      - neo4j-data:/data

    networks:
      - my_network

  user-db:
    image: postgres
    container_name: user-db
    environment:
      POSTGRES_DB: userDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: surajnarale
    volumes:
      - postgres_data://var/lib/postgresql/MAJOR/docker

    networks:
      - my_network

  post-db:
    image: postgres
    container_name: post-db
    environment:
      POSTGRES_DB: postDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: surajnarale
    volumes:
      - postgres_data:/var/lib/postgresql/MAJOR/docker

    networks:
      - my_network

  notification-db:
    image: postgres
    container_name: notification-db
    environment:
      POSTGRES_DB: notificationDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: surajnarale
    volumes:
      - postgres_data:/var/lib/postgresql/MAJOR/docker

    networks:
      - my_network


  api-gateway:
    image: krekrot/api-gateway:0.0.1
    container_name: api-gateway
    ports:
      - "9111:9111"
    networks:
      - my_network
    depends_on:
      - discovery-server
    environment:
      EUREKA_SERVER_URL: http://discovery-server:9024/eureka/


  discovery-server:
    image: krekrot/discover-server
    container_name: discovery-server
    ports:
      - "9024:9024"
    networks:
      - my_network


  posts-service:
    image : krekrot/linkedin-posts-service:0.0.1-SNAPSHOT
    container_name: posts-service
    ports:
      - "9021:9021"
    environment:
      POSTS_SERVICE_DB_URL: jdbc:postgresql://post-db:5432/postDB
      POSTS_DB_USERNAME: postgres
      POSTS_DB_PASSWORD: surajnarale
      EUREKA_SERVER_URL: http://discovery-server:9024/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - my_network
    depends_on:
      - post-db
      - kafka

  user-service:
    image: krekrot/linkedin-user-service:0.0.1-SNAPSHOT
    container_name: user-service
    ports:
      - "9022:9022"
    environment:
      USER_SERVICE_DB_URL: jdbc:postgresql://user-db:5432/userDB
      USER_DB_USERNAME: postgres
      USER_DB_PASSWORD: surajnarale
      EUREKA_SERVER_URL: http://discovery-server:9024/eureka/
    networks:
      - my_network
    depends_on:
      - user-db


  connection-service:
    image: krekrot/linkedin-connection-service:0.0.1-SNAPSHOT
    container_name: connection-service
    ports:
      - "9030:9030"
    environment:
      EUREKA_SERVER_URL: http://discovery-server:9024/eureka/
      NEO4J_URI: bolt://neo4j:7687
    networks:
      - my_network
    depends_on:
      - neo4j

  notification-service:
    image: krekrot/linkedin-notification-service:0.0.1-SNAPSHOT
    container_name: notification-service
    environment:
      NOTI_SERVICE_DB_URL: jdbc:postgresql://notification-db:5432/notificationDB
      NOTI_DB_USERNAME: postgres
      NOTI_DB_PASSWORD: surajnarale
      EUREKA_SERVER_URL: http://discovery-server:9024/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    ports:
      - "9040:9040"
    networks:
      - my_network
    depends_on:
      - notification-db
      - kafka

volumes:
  postgres_data:
  neo4j-data:

networks:
   my_network: