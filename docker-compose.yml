version: "3.9"

services:

  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    networks:
        - my-network


  neo4j:
    image: neo4j:5
    container_name: neo4j-db
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/LinkedIn

    volumes:
      - neo4j-data:/data

    networks:
      - my-network

  user_db:
    image: postgres
    container_name: user_db
    environment:
      POSTGRES_DB: userDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: surajnarale
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - my_network

  post_db:
    image: postgres
    container_name: post_db
    environment:
      POSTGRES_DB: postDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: surajnarale
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - my_network

  notification_db:
    image: postgres
    container_name: notification_db
    environment:
      POSTGRES_DB: notificationDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: surajnarale
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - my_network


  api_gateway:
    image: krekrot/api-gateway
    container_name: api_gateway
    ports:
      - "9111:9111"
    networks:
      - my_network
    depends_on:
      -

  discovery_server:
    image: krekrot/discovery-server
    container_name: discovery_server
    ports:
      - "9024:9024"
    networks:
      - my_network
    depends_on:
      -

  posts_service:
    image : krekrot/linkedin-posts-service
    container_name: posts_service
    ports:
      - "9021:9021"
    environment:
      POSTS_SERVICE_DB_URL: postgresql://user_db:5432/postDB
      POSTS_DB_USERNAME: postgres
      POSTS_DB_PASSWORD: surajnarale
      EUREKA_SERVER_URL: http://discovery_server:9024/eureka/
      KAFKA_BOOTSTRAP_SERVERS: http://kafka:9092
    networks:
      - my_network
    depends_on:
      -

  user_service:
    image: krekrot/linkedin-user-service
    container_name: user_service
    ports:
      - "9022:9022"
    environment:
      USER_SERVICE_DB_URL: postgresql://user_db:5432/userDB
      USER_DB_USERNAME: postgres
      USER_DB_PASSWORD: surajnarale
      EUREKA_SERVER_URL: http://discovery_server:9024/eureka/
    networks:
      - my_network
    depends_on:
      -

  connection_service:
    image: krekrot/linkedin-connection-service
    container_name: connection_service
    ports:
      - "9030:9030"
    environment:
      EUREKA_SERVER_URL: http://discovery_server:9024/eureka/
    networks:
      - my_network
    depends_on:
      -

  notification_service:
    image: krekrot/linkedin-notification-service
    container_name: notification_service
    environment:
      NOTI_SERVICE_DB_URL: postgresql://notification_db:5432/notificationDB
      NOTI_DB_USERNAME: postgres
      NOTI_DB_PASSWORD: surajnarale
      EUREKA_SERVER_URL: http://discovery_server:9024/eureka/
      KAFKA_BOOTSTRAP_SERVERS: http://kafka:9092

    ports:
      - "9040:9040"
    networks:
      - my_network
    depends_on:
      -

volumes:
  postgres_data:
  neo4j-data:

networks:
   my_networks: